# Local libSQL server for development (no Turso CLI required).
# Run: docker compose up -d
# Then set TURSO_DATABASE_URL=http://127.0.0.1:8080 in .dev.vars
# Migrate: npm run db:migrate
services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    ports:
      - "8080:8080"
    environment:
      SQLD_NODE: primary
    volumes:
      - libsql-data:/var/lib/sqld

volumes:
  libsql-data:
